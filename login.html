<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Wheel Spot</title>
<link rel="icon" href="assets/LOGO_FIX%20copy2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<main class="auth">
  <section class="auth__brand">
    <span class="logo logo--lg"><img src="assets/LOGO_FIX%20copy2.png" alt="Wheel Spot"></span>
    <div>
      <h1>Wheel Spot</h1>
      <p>Pantau ketersediaan slot parkir secara real-time, di mana pun kamu berada.</p>
    </div>
  </section>

  <section class="auth__panel">
    <form class="auth__card stack gap-4" data-fake data-msg="Berhasil masuk. Mengalihkan…" data-go="home.html">
      <h2>Masuk ke Akun</h2>

      <div class="field">
        <label class="label" for="email">Email Address</label>
        <input class="input" id="email" type="email" placeholder="anda@contoh.com" required autocomplete="email">
      </div>

      <div class="field">
        <label class="label" for="pass">Password</label>
        <input class="input" id="pass" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button class="btn btn--block btn--lg" type="submit">
        Login
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <p class="auth__foot">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
    </form>
  </section>
</main>
<script src="assets/app.js"></script>
</body>
</html>
