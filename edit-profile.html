<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Profile — Wheel Spot</title>
<link rel="icon" href="assets/LOGO_FIX%20copy2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="page page--app">

  <header class="topbar">
    <div class="topbar__inner">
      <a class="backlink" href="profile.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Edit Profile
      </a>
      <span class="topbar__spacer"></span>
      <a class="avatar" href="profile.html" aria-label="Profil saya">WS</a>
    </div>
  </header>

  <main class="container" style="padding-top:22px">
    <div class="split-side">

      <aside class="card center stack gap-3">
        <span class="avatar" style="width:110px;height:110px;font-size:30px;margin-inline:auto">WS</span>
        <h2 style="font-size:16px">Wheel Spot User</h2>
        <button class="btn btn--ghost" data-toast="Pemilih file dibuka (demo).">Ubah Foto Profil</button>
        <p class="tiny muted">JPG atau PNG, maks 5MB</p>
      </aside>

      <form class="card" data-fake data-msg="Perubahan disimpan." data-go="profile.html">
        <h2 class="card-title" style="font-size:16px">Informasi Akun</h2>
        <div class="form-grid mt-4">
          <div class="field"><label class="label" for="nama">Nama Lengkap</label><input class="input" id="nama" value="Wheel Spot User"></div>
          <div class="field"><label class="label" for="telp">Nomor Telepon</label><input class="input" id="telp" value="+62 812-3456-7890"></div>
          <div class="field">
            <label class="label" for="email">Email <span class="badge ok" style="font-size:11px">Terverifikasi</span></label>
            <input class="input" id="email" value="user@wheelspot.id" readonly>
          </div>
          <div class="field"><label class="label" for="jenis">Jenis Kendaraan</label>
            <select class="select" id="jenis"><option selected>Mobil (Passenger Car)</option><option>Motor</option><option>SUV / MPV</option><option>Mobil Listrik (EV)</option></select>
          </div>
          <div class="field col-span-2"><label class="label" for="plat">No. Kendaraan (Plat)</label><input class="input" id="plat" value="B 1234 SPOT" style="text-transform:uppercase"></div>
        </div>
        <div class="form-actions">
          <button class="btn" type="submit">Simpan Perubahan</button>
          <a class="btn btn--ghost" href="profile.html">Batal</a>
        </div>
      </form>
    </div>
  </main>

  <nav class="bottomnav" aria-label="Navigasi utama">
    <div class="bottomnav__inner">
      <a class="navitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
      <a class="navitem" href="find.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find</a>
      <a class="navitem" href="news.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>News</a>
      <a class="navitem" href="profile.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile</a>
    </div>
  </nav>
</div>
<script src="assets/app.js"></script>
</body>
</html>
