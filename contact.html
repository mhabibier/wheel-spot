<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="assets/LOGO_FIX%20copy2.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="page page--app">

  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__title" href="news.html">Hubungi Kami</a>
      <span class="topbar__spacer"></span>
      <a class="avatar" href="profile.html" aria-label="Profil saya">WS</a>
    </div>
  </header>

  <main class="container stack gap-4" style="padding-top:20px">

    <div class="segmented">
      <a href="news.html">Updates</a>
      <a href="ratings.html">Ratings</a>
      <a class="on" href="contact.html">Hubungi Kami</a>
    </div>

    <div class="split-2">

      <div class="stack gap-3">
        <div class="card">
          <p style="font-weight:800">🏛️ Admin &amp; Support</p>
          <p class="small muted mt-2">support@wheelspot.com<br>+62 811 2345 6789</p>
        </div>
        <div class="card">
          <p style="font-weight:800">📍 Kantor Pusat</p>
          <p class="small muted mt-2">Gedung Vigilance Lt.12<br>Jl. Jend. Sudirman Kav.1, Jakarta Selatan</p>
        </div>
        <div class="card">
          <p style="font-weight:800">🕒 Jam Layanan</p>
          <p class="small muted mt-2">Senin – Jumat: 08:00 – 18:00<br>Sabtu – Minggu: Libur</p>
        </div>
        <div class="thumb thumb--wide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      </div>

      <form class="card stack gap-4" data-fake data-msg="Pesan terkirim. Tim kami akan membalas via email.">
        <h2 class="card-title" style="font-size:16px">Kirim Pesan</h2>
        <div class="field"><label class="label" for="n">Nama Lengkap</label><input class="input" id="n" placeholder="Masukkan nama Anda" required></div>
        <div class="field"><label class="label" for="e">Alamat Email</label><input class="input" id="e" type="email" placeholder="nama@email.com" required></div>
        <div class="field"><label class="label" for="t">Nomor Telp</label><input class="input" id="t" type="tel" placeholder="08xx xxxx xxxx"></div>
        <div class="field"><label class="label" for="l">Lokasi Fasilitas (Opsional)</label>
          <select class="select" id="l"><option value="" selected disabled>Pilih Lokasi Parkir</option><option>Miko Mall</option><option>Ciwalk</option><option>Paskal</option><option>BIP</option></select>
        </div>
        <div class="field"><label class="label" for="m">Pesan / Kendala</label><textarea class="textarea" id="m" placeholder="Jelaskan detail pertanyaan Anda…" required></textarea></div>
        <button class="btn btn--block" type="submit">Kirim Pesan ➤</button>
      </form>
    </div>
  </main>

  <nav class="bottomnav" aria-label="Navigasi utama">
    <div class="bottomnav__inner">
      <a class="navitem" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</a>
      <a class="navitem" href="find.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find</a>
      <a class="navitem" href="news.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>News</a>
      <a class="navitem" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile</a>
    </div>
  </nav>
</div>
